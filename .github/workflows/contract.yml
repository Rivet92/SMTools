name: Contract Check

on:
  workflow_call:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # pin@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # pin@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore backend
        run: dotnet restore backend/src/SMTools.Api/SMTools.Api.csproj

      - name: Dump OpenAPI (DB-less Testing env)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet run --project backend/src/SMTools.Api/SMTools.Api.csproj --configuration Release -- --dump-openapi=openapi.snapshot.json

      - name: Install frontend deps
        run: pnpm --filter frontend install --frozen-lockfile

      - name: Regenerate api.ts
        run: pnpm --filter frontend generate-types

      - name: Fail if drift
        run: git diff --exit-code openapi.snapshot.json frontend/src/types/generated/api.ts
