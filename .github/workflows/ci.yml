name: CI

on:
  push:
    branches: [feature/**, hotfix/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Verification
    uses: ./.github/workflows/verify-backend.yml

  frontend:
    name: Frontend Verification
    uses: ./.github/workflows/verify-frontend.yml

  contract:
    name: API Contract
    uses: ./.github/workflows/contract.yml
