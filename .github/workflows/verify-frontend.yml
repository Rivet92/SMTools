name: Verify Frontend

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # pin@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        run: pnpm audit
        working-directory: frontend

      - name: Lint
        run: pnpm --filter frontend lint --max-warnings 0

      - name: Check formatting
        run: pnpm --filter frontend format:check

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Run tests
        run: pnpm --filter frontend test

      - name: Run tests with coverage
        run: pnpm --filter frontend test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pin@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # pin@v6
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Build
        run: pnpm --filter frontend build
