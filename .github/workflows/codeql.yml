name: CodeQL

on:
  push:
    branches: [main, feature/**, hotfix/**]
  pull_request:
    branches: [main]

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin@v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # pin@v6
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # pin@v4
        with:
          languages: csharp, javascript-typescript
          build-mode: manual

      - run: dotnet build SMTools.slnx --configuration Release

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # pin@v4
