name: Verify Backend

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smtools_test
          POSTGRES_USER: smtools
          POSTGRES_PASSWORD: smtools
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # pin@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # pin@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Check NuGet vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-vulns.txt
          if grep -qi "vulnerability" nuget-vulns.txt; then
            # sqlitepclraw replacement by sourcegear.sqlite3
            if ! grep -v "GHSA-2m69-gcr7-jv3q" nuget-vulns.txt | grep -qi "vulnerability"; then
              echo "Only known suppressed advisory: GHSA-2m69-gcr7-jv3q (SQLitePCLRaw.lib.e_sqlite3 - replaced by SourceGear.sqlite3)"
            else
              echo "Vulnerabilities found!"
              cat nuget-vulns.txt
              exit 1
            fi
          fi

      - name: Check formatting
        run: dotnet format SMTools.slnx --verify-no-changes

      - name: Run tests with coverage
        run: dotnet test tests/SMToolsBackend.Tests/SMToolsBackend.Tests.csproj --no-restore --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --settings tests/SMToolsBackend.Tests/.runsettings
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=smtools_test;Username=smtools;Password=smtools

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pin@v7
        with:
          name: backend-coverage
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # pin@v6
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: backend
          fail_ci_if_error: true
